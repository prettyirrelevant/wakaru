name = "wakaru-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/openai/gpt-oss-120b"
CATEGORIZE_MODEL = "typesafe/jev"
AI_GATEWAY_ID = "default"
ALLOWED_ORIGINS = ""

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "CATEGORIZE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.dev]
name = "wakaru-api-dev"

[env.dev.ai]
binding = "AI"

[env.dev.vars]
AI_MODEL = "@cf/openai/gpt-oss-120b"
CATEGORIZE_MODEL = "typesafe/jev"
AI_GATEWAY_ID = "default"
ALLOWED_ORIGINS = "http://localhost:5173"

[[env.dev.ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.dev.ratelimits]]
name = "CATEGORIZE_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }
